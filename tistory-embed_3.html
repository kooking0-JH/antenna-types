<!-- 그림으로 보는 햄 안테나 — 티스토리 글에 넣는 코드 (antenna-types)
     글쓰기 → 오른쪽 위 [기본모드] → [HTML]로 바꾼 뒤, 아래 전체를 붙여 넣습니다.
     다른 편을 넣을 때는 아래 src의 basics.html만 바꿉니다.
       목차 index.html · 기초 basics.html · 다이폴 dipole.html · 모노폴 monopole.html
       야기 yagi.html · 루프 loop.html · 로그 주기 lpda.html · 그 밖의 안테나 others.html
     높이 자동 맞춤, 페이지 안 목차 링크 이동, 이전·다음 편 이동 시 글 맨 위로 이동을 처리합니다.
     (assets/site.js 규약: antenna-types:height / antenna-types:scroll / antenna-types:ping) -->
<div style="margin:0 auto;max-width:900px">
<iframe id="at-frame" src="https://kooking0-jh.github.io/antenna-types/basics.html" title="그림으로 보는 햄 안테나"
  style="display:block;width:100%;height:1200px;border:0" loading="eager"></iframe>
<p style="font-size:13px;color:#6b7385;text-align:center;margin:8px 0 0">
  화면이 잘 보이지 않으면 <a href="https://kooking0-jh.github.io/antenna-types/basics.html" target="_blank" rel="noopener">새 창에서 열기</a>
</p>
</div>
<script>
(function(){
  var f = document.getElementById('at-frame');
  if (!f) return;
  var ORIGIN = new URL(f.src, location.href).origin;
  var page = null;
  function frameTop(){ return f.getBoundingClientRect().top + window.pageYOffset; }
  function go(y){ try { window.scrollTo({top: Math.max(0, y), behavior: 'smooth'}); } catch(e){ window.scrollTo(0, Math.max(0, y)); } }

  window.addEventListener('message', function(e){
    if (e.origin !== ORIGIN || e.source !== f.contentWindow) return;
    var d = e.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'antenna-types:height'){
      var h = +d.height;
      if (h > 100) f.style.height = (h + 4) + 'px';
      /* 이전·다음 편으로 넘어가면 새 편의 맨 위가 보이게 */
      if (page !== null && d.page && d.page !== page && f.getBoundingClientRect().top < 0) go(frameTop() - 16);
      if (d.page) page = d.page;
    } else if (d.type === 'antenna-types:scroll'){
      /* 페이지 안 목차 링크: 그 제목이 블로그 화면 위쪽에 오도록 */
      go(frameTop() + (+d.top || 0) - 70);
    }
  });

  /* 블로그 쪽 코드가 늦게 실행되어 첫 높이 신호를 놓쳤을 때 다시 요청 */
  function ping(){ try { f.contentWindow.postMessage({type: 'antenna-types:ping'}, ORIGIN); } catch(e){} }
  f.addEventListener('load', ping);
  var n = 0, iv = setInterval(function(){ ping(); if (++n >= 10) clearInterval(iv); }, 600);
})();
</script>
